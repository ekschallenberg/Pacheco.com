<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market · Job Watcher</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b6b57">
<link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/style.css"></head><body>
<nav id="nav"></nav><main>
<h1>Market report</h1>
<p class="muted" id="intro">Loading…</p>
<div id="report"></div>
</main>
<script src="assets/app.js"></script><script src="assets/market.js"></script><script src="assets/charts.js"></script>
<script>
(async () => {
  let rows;
  try { rows = await JW.loadHistory(); } catch (e) { document.getElementById("intro").textContent = "No data yet. Come back after the first pipeline run."; return; }
  const m = JWMarket.compute(rows), C = JWCharts, $ = x => x.toLocaleString();
  const days = [...new Set([...m.newAll, ...m.newRole, ...m.removedPerDay].map(p => p[0]))].sort();
  const total = a => a.reduce((s, p) => s + p[1], 0);
  document.getElementById("intro").textContent = `Computed in your browser from data/history.csv (${$(rows.length)} postings, last run ${m.lastRun}). Postings already open when watching began are left out where the section says so.`;
  const sec = (title, text, chart) => `<h2>${title}</h2><p>${text}</p><div class="chart">${chart}</div>`;
  const topEmp = m.openByEmployer[0], topLoc = m.topLocations[0];
  const md = m.daysOpen.median, q = m.quick;
  const html = [
    sec(days.length ? `${$(total(m.newAll))} new postings appeared; ${$(total(m.newRole))} were in my role` : "New postings per day: waiting for a second run",
      "Postings first seen on each day, leaving out those already open on a source’s first run. The first run has no new postings by definition, so this chart fills in from the second day on.",
      C.columns(days, [{ label: "All postings", color: "var(--chart2)", points: m.newAll }, { label: "My role", color: "var(--chart)", points: m.newRole }], { label: "New postings per day" })),
    sec(m.removedPerDay.length ? `${$(total(m.removedPerDay))} postings were removed` : "No postings have been removed yet",
      "Postings whose source stopped listing them, counted on the day the removal was seen. Postings that were open at the first run are included once they disappear.",
      C.columns(m.removedPerDay.map(p => p[0]), [{ label: "Removed", color: "var(--chart)", points: m.removedPerDay }], { label: "Removed postings per day" })),
    sec(topEmp ? `${topEmp[0]} has the most open postings (${$(topEmp[1])})` : "Open postings per employer",
      `As of the last run (${m.lastRun || "n/a"}), ${$(total(m.openByEmployer))} postings are open across ${m.openByEmployer.length} employers.`,
      C.hbars(m.openByEmployer, { label: "Open postings per employer" })),
    sec(md === null ? "Days open: no completed postings yet" : `Postings that closed stayed open a median of ${md} day${md === 1 ? "" : "s"}`,
      md === null ? "This needs postings that were first seen after watching began and have since been removed." :
      `Based on ${$(m.daysOpen.n)} removed postings that were not already open at the first run: removed date minus first-seen date, median ${md} days (shortest ${Math.min(...m.daysOpen.values)}, longest ${Math.max(...m.daysOpen.values)}).`,
      C.hbars(histogram(m.daysOpen.values), { label: "Days open for removed postings" })),
    sec(q.share === null ? "Share removed within seven days: not enough history yet" : `${(q.share * 100).toFixed(1)}% of postings were removed within seven days`,
      q.share === null ? "This needs postings first seen at least seven days before the last run." :
      `Of ${$(q.cohort)} postings that were not already open at the first run and were first seen at least seven days before the last run, ${$(q.removedWithin7)} were removed within seven days.`,
      C.hbars([["Removed within 7 days", q.removedWithin7], ["Everything else", q.cohort - q.removedWithin7]], { label: "Share removed within seven days" })),
    sec(topLoc ? `${topLoc[0]} is the top location (${$(topLoc[1])} open postings)` : "Top locations",
      "The ten locations with the most open postings at the last run, using each source’s own location text.",
      C.hbars(m.topLocations, { label: "Top locations among open postings" })),
  ];
  function histogram(vals) {
    if (!vals.length) return [];
    const bins = [["0–1 days", 0, 1], ["2–7 days", 2, 7], ["8–14 days", 8, 14], ["15–30 days", 15, 30], ["31+ days", 31, 1e9]];
    return bins.map(([l, lo, hi]) => [l, vals.filter(v => v >= lo && v <= hi).length]);
  }
  document.getElementById("report").innerHTML = html.join("");
})();
</script>
</body></html>
