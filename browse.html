<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse · Job Watcher</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1c3946">
<link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"></head><body>
<nav id="nav"></nav>
<header class="hero"><h1>Browse Open Postings</h1><p>Search the open roles at all 16 employers. Days open counts from the first-seen date; for postings that were already open when watching began, it is a minimum.</p></header>
<main>
<div class="toolbar">
<div class="seg" role="group" aria-label="Scope"><button id="scopeRole" aria-pressed="true">My Role</button><button id="scopeAll" aria-pressed="false">All Postings</button><button id="scopeShort" aria-pressed="false">★ Shortlist (<span id="shortN">0</span>)</button></div>
</div>
<div class="filters">
  <div class="pair">
    <label>Search Titles<input id="q" type="search" placeholder="e.g. FP&amp;A"></label>
    <label>Location Contains<input id="loc" list="locs" placeholder="e.g. New York"><datalist id="locs"></datalist></label>
  </div>
  <label>Employer<select id="emp"><option value="">All employers</option></select></label>
  <label>Days Open<select id="days"><option value="0">Any</option><option value="7">7 or more</option><option value="14">14 or more</option><option value="30">30 or more</option><option value="90">90 or more</option></select></label>
  <label>Sort by First Seen<select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select></label>
</div>
<p id="count" class="muted"></p>
<div id="list"></div>
<p style="text-align:center"><button class="btn" id="more" hidden>Show More</button></p>
</main>
<script src="assets/app.js"></script>
<script>
(async () => {
  const { loadHistory, esc, dayNum } = JW;
  let rows, allRows;
  try { allRows = await loadHistory(); rows = allRows.filter(r => r.status === "open"); }
  catch (e) { document.getElementById("list").innerHTML = '<div class="notice">No data yet. Come back after the first pipeline run.</div>'; return; }
  const lastRun = rows.reduce((m, r) => r.last_seen > m ? r.last_seen : m, "");
  rows.forEach(r => r.daysOpen = dayNum(lastRun) - dayNum(r.first_seen));
  const KEY = "jobwatcher.shortlist";
  const load = () => { try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) { return new Set(); } };
  const save = s => { try { localStorage.setItem(KEY, JSON.stringify([...s])); } catch (e) {} };
  const stars = load();
  const $ = id => document.getElementById(id);
  let view = "role", shown = 100;  // view: role | all | short
  $("emp").innerHTML += [...new Set(rows.map(r => r.employer))].sort().map(e => `<option>${esc(e)}</option>`).join("");
  $("locs").innerHTML = [...new Set(rows.map(r => r.location).filter(Boolean))].sort().map(l => `<option value="${esc(l)}">`).join("");

  function render() {
    const q = $("q").value.trim().toLowerCase(), emp = $("emp").value, loc = $("loc").value.trim().toLowerCase(), md = +$("days").value;
    // the shortlist shows every starred posting (any role, and ones since removed); other views show open postings
    const base = view === "short" ? allRows.filter(r => stars.has(r.posting_id)) : rows;
    let out = base.filter(r => (view !== "role" || r.in_role) && (!emp || r.employer === emp) && (!loc || r.location.toLowerCase().includes(loc)) &&
      (view === "short" || r.daysOpen >= md) && (!q || r.title.toLowerCase().includes(q)));
    $("shortN").textContent = stars.size;
    out.sort((a, b) => a.first_seen === b.first_seen ? (a.posting_id < b.posting_id ? -1 : 1) : (a.first_seen < b.first_seen ? -1 : 1));
    if ($("sort").value === "new") out.reverse();
    $("count").textContent = `${out.length.toLocaleString("en-US")} posting${out.length === 1 ? "" : "s"}`;
    $("list").innerHTML = out.length ? `<ul class="postings">` + out.slice(0, shown).map(r => `<li><button class="star ${stars.has(r.posting_id) ? "on" : ""}" data-id="${esc(r.posting_id)}" aria-label="Save to shortlist" aria-pressed="${stars.has(r.posting_id)}">${stars.has(r.posting_id) ? "★" : "☆"}</button>
      <div class="main"><div class="title">${esc(r.title || "(untitled)")}</div><div class="small muted">${esc(r.employer)} · ${esc(r.location || "no location")}${r.department ? " · " + esc(r.department) : ""}</div>
      <div class="small muted">First seen ${r.first_seen}${r.first_run ? " (already open)" : ""} · ${r.status === "removed" ? '<span class="pill">Removed ' + r.removed_date + "</span>" : r.daysOpen + " day" + (r.daysOpen === 1 ? "" : "s") + " open"}</div></div>
      <a class="apply" href="${esc(r.url)}" target="_blank" rel="noopener">Apply</a></li>`).join("") + `</ul>` : `<div class="empty">${view === "short" ? "Your shortlist is empty. Tap ☆ on a posting to save it here." : "No postings match." + (view === "role" ? " Try “All postings”." : "")}</div>`;
    $("more").hidden = out.length <= shown;
  }
  $("list").addEventListener("click", e => {
    const b = e.target.closest(".star"); if (!b) return;
    const id = b.dataset.id; stars.has(id) ? stars.delete(id) : stars.add(id); save(stars); render();
  });
  ["q", "emp", "loc", "days", "sort"].forEach(id => $(id).addEventListener("input", () => { shown = 100; render(); }));
  $("more").addEventListener("click", () => { shown += 100; render(); });
  const tabs = [["scopeRole", "role"], ["scopeAll", "all"], ["scopeShort", "short"]];
  tabs.forEach(([id, v]) => $(id).addEventListener("click", () => {
    view = v; tabs.forEach(([i, w]) => $(i).setAttribute("aria-pressed", w === v)); shown = 100; render();
  }));
  render();
})();
</script>
</body></html>
